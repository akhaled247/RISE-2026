[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rise-training"
version = "0.1.0"
description = "SafePO training and evaluation for SpecRLBench (RISE-2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "gymnasium>=0.29.1,<1.0",
    "numpy<2",
    "pyyaml>=6.0",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "joblib",
    "moviepy>=1.0.3",
    "rich>=13.3.0",
    "scipy",
    "wandb>=0.13.0",
    "seaborn",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rise_training*"]
