# Shared SAR recipe for MultiGoalSARLevel* and CustomizedSAR.
# gremlins.num is never a free field — always agent_num in code.

must_be_constant:
  observation_flatten: false
  lidar_conf:
    type: pseudo
    alias: true
  cost_conf:
    constrain_indicator: false
  mechanism_conf:
    continue_goal: false
  placements_conf:
    extents: [-3.5, -3.5, 3.5, 3.5]
  agent:
    placements: [[-0.67, -0.67, 0.67, 0.67]]
    keepout: 0.25
  render_conf:
    lidar_markers: false

configurable:
  wall_ring_radius: 2.0
  wall_margin: 1.0
  wall_base_half_sizes: [0.1, 0.3, 0.2]
  walls_keepout: 0.4
  walls_half_size_randomization: true
  building_keepout: 0.4
  building_border_side_length: 4.5
  building_margin: 0.8
  building_perimeter_walls:
    height: 0.75
    collision_threshold: 8.0
  casualty_size: 0.05
  casualty_touch_offset: 0.15
  casualty_keepout: 0.2
  lidar_conf:
    max_dist: null
    exp_gain: 0.5
  gremlins:
    size: 0.175
    dist_threshold: 0.175
    keepout: 0.0

# Defaults for CustomizedSAR only; stock levels ignore this section.
easy:
  agent_num: 2
  building_num: null  # null → agent_num
  wall_count: 10
  surface_casualties_enabled: true
  entrapped_casualties_enabled: false
  reward_goal: 1.0
  lidar_conf:
    num_bins: 16
